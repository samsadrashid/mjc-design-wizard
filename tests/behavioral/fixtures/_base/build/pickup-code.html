<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pickup code (build)</title>
<style>
  body { font-size: 16px; color: #1A202C; }
  .card { padding: 12px; border-radius: 8px; max-width: 360px; }
  .code { font-size: 28px; font-weight: 700; color: #2B6CB0; }
  .copy { background: #fff; border: 1px solid #1E4FD8; color: #1E4FD8; padding: 6px 10px; height: 32px; }
  .qr { width: 120px; height: 120px; }
</style></head>
<body><div class="card">
  <h2>Your pickup code</h2>
  <p class="code">KX-4821</p>
  <button class="copy">Copy</button>
  <img class="qr" src="qr.png" alt="QR code for pickup">
</div></body></html>
